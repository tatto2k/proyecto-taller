<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style> 
    .card {
        border: 2px solid #0b0b0c;
        border-radius: 24px;
    }

    .form-control {
        border: 1px solid #6c757d;
        background-color: #f8f9fa;
        border-radius: 16px;
        padding: 12px 18px;
    }

    .form-control:focus {
        border-color: #0d6efd;
        background-color: #ffffff;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
    }

    .form-label {
        font-weight: 600;
        margin-left: 6px;
    }

    .btn {
        border-radius: 16px;
        padding: 10px;
    }
    </style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4" style="width: 350px;">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        
        <div class="mb-3">
            <label for="input-mail" class="form-label">Correo electrónico</label>
            <input type="email" id="input-mail" class="form-control" placeholder="">
        </div>

        <div class="mb-3">
            <label for="input-password" class="form-label">Contraseña</label>
            <input type="password" id="input-password" class="form-control" placeholder="">
        </div>

        <button onclick="login()" class="btn btn-primary w-100">Entrar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
