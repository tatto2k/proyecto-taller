<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4" style="width: 350px;">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        
        <div class="mb-3">
            <label for="input-mail" class="form-label">Correo electrónico</label>
            <input type="email" id="input-mail" class="form-control" placeholder="">
        </div>

        <div class="mb-3">
            <label for="input-password" class="form-label">Contraseña</label>
            <input type="password" id="input-password" class="form-control" placeholder="">
        </div>

        <button onclick="login()" class="btn btn-primary w-100">Entrar</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
