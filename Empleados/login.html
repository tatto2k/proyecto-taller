<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Empleados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #eaf0f4;
            --surface: #ffffff;
            --ink: #18242d;
            --muted: #5d6b77;
            --line: #d3dce4;
            --field-line: #b9c6d1;
            --accent: #17455c;
            --accent-hover: #0f3345;
            --accent-soft: #e4eff4;
            --radius: 12px;
            --bs-body-font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
            --bs-body-color: var(--ink);
            --bs-body-bg: var(--bg);
        }

        body { background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }

        /* Barra superior */
        .topbar { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(15, 51, 69, .25); }
        .topbar .container { min-height: 60px; display: flex; align-items: center; }
        .brand { display: flex; align-items: center; gap: .65rem; font-weight: 600; font-size: 1.05rem; color: #fff; }
        .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .3); color: #fff; display: grid; place-items: center; }

        /* Contenido centrado */
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }

        /* Panel */
        .card { width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(23, 69, 92, .08); overflow: hidden; }
        .panel-head { display: flex; align-items: center; gap: .85rem; padding: 1rem 1.5rem; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
        .panel-icon { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; }
        .panel-head h1 { font-size: 1.05rem; font-weight: 600; margin: 0; }
        .panel-head p { margin: 0; font-size: .875rem; color: var(--muted); }
        .panel-body { padding: 1.5rem; }

        /* Campos: borde visible que cambia de color al seleccionarlos */
        .form-control { background: var(--surface); border: 1.5px solid var(--field-line); border-radius: 9px; transition: border-color .15s, box-shadow .15s; }
        .form-control:hover { border-color: #8fa3b3; }
        .form-control:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(23, 69, 92, .15); }
        .form-floating > label { color: var(--muted); }

        /* Botón */
        .btn.btn-primary { --bs-btn-bg: var(--accent); --bs-btn-border-color: var(--accent); --bs-btn-hover-bg: var(--accent-hover); --bs-btn-hover-border-color: var(--accent-hover); --bs-btn-active-bg: var(--accent-hover); --bs-btn-active-border-color: var(--accent-hover); --bs-btn-focus-shadow-rgb: 23, 69, 92; font-weight: 600; border-radius: 9px; height: 52px; }

        /* Aviso */
        .aviso { display: flex; align-items: flex-start; gap: .55rem; margin-top: 1.25rem; padding: .75rem .9rem; background: #f4f7f9; border: 1px solid var(--line); border-radius: 9px; color: var(--muted); font-size: .875rem; line-height: 1.4; }
        .aviso svg { flex: none; margin-top: 2px; color: var(--accent); }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .topbar :focus-visible { outline-color: #fff; }
    </style>
</head>
<body>

    <nav class="topbar">
        <div class="container">
            <span class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </span>
                Sistema de empleados
            </span>
        </div>
    </nav>

    <main>
        <section class="card" aria-labelledby="titulo-login">
            <div class="panel-head">
                <span class="panel-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                </span>
                <div>
                    <h1 id="titulo-login">Iniciar sesión</h1>
                    <p>Ingresa con tu cuenta para continuar.</p>
                </div>
            </div>

            <div class="panel-body">
                <div class="form-floating mb-3">
                    <input type="email" id="input-mail" class="form-control" placeholder="Correo electrónico">
                    <label for="input-mail">Correo electrónico</label>
                </div>

                <div class="form-floating mb-4">
                    <input type="password" id="input-password" class="form-control" placeholder="Contraseña">
                    <label for="input-password">Contraseña</label>
                </div>

                <button class="btn btn-primary w-100">Entrar</button>

                <p class="aviso" role="note">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                    <span>Acceso restringido a administradores dados de alta en el sistema.</span>
                </p>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
