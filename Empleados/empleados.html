<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Sistema de Empleados</a>
            <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Lista de Empleados</h2>

        <div class="card shadow p-4 mb-4">
            <h4>Gestión de Empleados</h4>
            <div class="row g-3 mt-2">
                <div class="col-md-4">
                    <input type="text" id="nombre" class="form-control" placeholder="Nombre">
                </div>
                <div class="col-md-4">
                    <input type="text" id="apellidos" class="form-control" placeholder="Apellidos">
                </div>
                <div class="col-md-4">
                    <input type="text" id="telefono" class="form-control" placeholder="Teléfono">
                </div>
                <div class="col-md-6">
                    <input type="email" id="correo" class="form-control" placeholder="Correo electrónico">
                </div>
                <div class="col-md-6">
                    <input type="text" id="direccion" class="form-control" placeholder="Dirección">
                </div>
                <div class="col-12">
                    <button id="btn-guardar" onclick="agregarEmpleado()" class="btn btn-success">Guardar Empleado</button>
                </div>
            </div>
        </div>

        <div class="card shadow p-4">
            <div class="mb-3">
                <input type="text" id="input-buscar" class="form-control" placeholder="Buscar empleado por nombre o apellidos..." onkeyup="buscarEmpleado()">
            </div>

            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Teléfono</th>
                        <th>Correo</th>
                        <th>Dirección</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-empleados">
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/empleados.js"></script>
</body>
</html>
