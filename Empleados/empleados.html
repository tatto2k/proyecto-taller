<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #eaf0f4;
            --surface: #ffffff;
            --ink: #18242d;
            --muted: #5d6b77;
            --line: #d3dce4;
            --field-line: #b9c6d1;
            --accent: #17455c;
            --accent-hover: #0f3345;
            --accent-soft: #e4eff4;
            --radius: 12px;
            --bs-body-font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
            --bs-body-color: var(--ink);
            --bs-body-bg: var(--bg);
            --bs-border-color: var(--line);
        }

        body { background: var(--bg); color: var(--ink); }

        /* Barra superior */
        .topbar { background: var(--accent); color: #fff; box-shadow: 0 2px 8px rgba(15, 51, 69, .25); position: sticky; top: 0; z-index: 10; }
        .topbar .container { min-height: 60px; }
        .topbar .brand { display: flex; align-items: center; gap: .65rem; font-weight: 600; font-size: 1.05rem; color: #fff; text-decoration: none; }
        .topbar .brand:hover { color: #fff; }
        .brand-mark { width: 34px; height: 34px; border-radius: 9px; background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .3); color: #fff; display: grid; place-items: center; }

        /* Encabezado de página */
        .page-head h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -.01em; margin: 0; }
        .page-head p { color: var(--muted); margin: .2rem 0 0; }
        .count-chip { background: var(--surface); border: 1px solid var(--line); color: var(--accent); font-weight: 600; font-size: .9rem; padding: .35rem .8rem; border-radius: 999px; white-space: nowrap; }

        /* Secciones */
        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 1px 3px rgba(23, 69, 92, .08); overflow: hidden; }
        .panel-head { display: flex; align-items: center; gap: .85rem; padding: 1rem 1.5rem; background: var(--accent-soft); border-bottom: 1px solid var(--line); }
        .panel-icon { width: 36px; height: 36px; flex: none; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; }
        .panel-head h2 { font-size: 1.05rem; font-weight: 600; margin: 0; }
        .panel-head p { margin: 0; font-size: .875rem; color: var(--muted); }
        .panel-body { padding: 1.5rem; }

        /* Campos: borde visible que cambia de color al seleccionarlos */
        .form-control { background: var(--surface); border: 1.5px solid var(--field-line); border-radius: 9px; transition: border-color .15s, box-shadow .15s; }
        .form-control:hover { border-color: #8fa3b3; }
        .form-control:focus { background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(23, 69, 92, .15); }
        .form-floating > label { color: var(--muted); }

        /* Botones */
        .btn-guardar { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; border-radius: 9px; height: 58px; }
        .btn-guardar:hover, .btn-guardar:focus-visible { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
        .btn-salir { background: #c0392b; border: 1px solid #c0392b; color: #fff; font-weight: 500; border-radius: 9px; }
        .btn-salir:hover, .btn-salir:focus-visible { background: #a02f23; border-color: #a02f23; color: #fff; }

        /* Búsqueda */
        .search { position: relative; }
        .search svg { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
        .search .form-control { padding-left: 2.6rem; height: 46px; }

        /* Tabla */
        .table-wrap { overflow-x: auto; border: 1.5px solid var(--field-line); border-radius: 10px; }
        .tabla { --bs-table-bg: transparent; margin: 0; width: 100%; }
        .tabla thead th { background: #f4f7f9; color: var(--muted); font-weight: 600; font-size: .85rem; border-bottom: 1px solid var(--line); padding: .75rem .9rem; white-space: nowrap; }
        .tabla tbody td { padding: .8rem .9rem; vertical-align: middle; border-bottom: 1px solid var(--line); background: var(--surface); }
        .tabla tbody tr:last-child td { border-bottom: 0; }
        .tabla tbody tr { cursor: pointer; }
        .tabla tbody tr:hover td { background: #f4f8fa; }
        .tabla tbody tr.seleccionada td { background: var(--accent-soft); }
        .tabla tbody tr.seleccionada td:first-child { box-shadow: inset 4px 0 0 var(--accent); }
        .tabla td:last-child { white-space: nowrap; }
        #tabla-empleados .btn { --bs-btn-padding-y: .25rem; --bs-btn-padding-x: .6rem; --bs-btn-font-size: .8rem; border-radius: 7px; display: inline-block; margin: 0 .3rem 0 0; }

        /* Estado vacío */
        .vacio { display: none; text-align: center; padding: 2.5rem 1rem; color: var(--muted); }
        .vacio strong { display: block; color: var(--ink); margin-bottom: .2rem; }
        .vacio.visible { display: block; }

        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .topbar :focus-visible { outline-color: #fff; }
    </style>
</head>
<body>

    <nav class="topbar mb-4">
        <div class="container d-flex align-items-center justify-content-between">
            <a class="brand" href="#">
                <span class="brand-mark" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M21 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                </span>
                Sistema de empleados
            </a>
            <button onclick="cerrarSesion()" class="btn btn-salir btn-sm px-3">Cerrar sesión</button>
        </div>
    </nav>

    <main class="container pb-5">

        <header class="page-head d-flex align-items-start justify-content-between gap-3 mb-4">
            <div>
                <h1>Empleados</h1>
            </div>
            <span class="count-chip" id="contador">0 empleados</span>
        </header>

        <!-- Sección: formulario -->
        <section class="panel mb-4" aria-labelledby="titulo-form">
            <div class="panel-head">
                <span class="panel-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
                </span>
                <div>
                    <h2 id="titulo-form">Nuevo empleado</h2>
                    <p>Captura los datos de contacto y guarda.</p>
                </div>
            </div>
            <div class="panel-body">
                <div class="row g-3">
                    <div class="col-md-6 col-lg-4">
                        <div class="form-floating">
                            <input type="text" id="nombre" class="form-control" placeholder="Nombre">
                            <label for="nombre">Nombre</label>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="form-floating">
                            <input type="text" id="apellidos" class="form-control" placeholder="Apellidos">
                            <label for="apellidos">Apellidos</label>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="form-floating">
                            <input type="text" id="telefono" class="form-control" placeholder="Teléfono">
                            <label for="telefono">Teléfono</label>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="form-floating">
                            <input type="email" id="correo" class="form-control" placeholder="Correo electrónico">
                            <label for="correo">Correo electrónico</label>
                        </div>
                    </div>
                    <div class="col-md-8 col-lg-5">
                        <div class="form-floating">
                            <input type="text" id="direccion" class="form-control" placeholder="Dirección">
                            <label for="direccion">Dirección</label>
                        </div>
                    </div>
                    <div class="col-md-4 col-lg-3 d-grid">
                        <button id="btn-guardar" onclick="agregarEmpleado()" class="btn btn-guardar">Guardar empleado</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Sección: lista -->
        <section class="panel" aria-labelledby="titulo-lista">
            <div class="panel-head">
                <span class="panel-icon" aria-hidden="true">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
                </span>
                <div>
                    <h2 id="titulo-lista">Lista de empleados</h2>
                    <p>Haz clic en una fila para resaltarla.</p>
                </div>
            </div>
            <div class="panel-body">
                <div class="search mb-3">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="input-buscar" class="form-control" placeholder="Buscar por ID, nombre o apellidos" aria-label="Buscar empleado" onkeyup="buscarEmpleado()">
                </div>

                <div class="table-wrap">
                    <table class="table tabla">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellidos</th>
                                <th>Teléfono</th>
                                <th>Correo</th>
                                <th>Dirección</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-empleados"></tbody>
                    </table>
                </div>

                <div class="vacio" id="vacio">
                    <strong>No hay empleados para mostrar</strong>
                    Agrega uno desde el formulario o ajusta tu búsqueda.
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="js/empleados.js"></script>

    <script>
        (function () {
            const tbody = document.getElementById('tabla-empleados');
            const contador = document.getElementById('contador');
            const vacio = document.getElementById('vacio');

            function actualizar() {
                const n = tbody.querySelectorAll('tr').length;
                contador.textContent = n + (n === 1 ? ' empleado' : ' empleados');
                vacio.classList.toggle('visible', n === 0);
            }

            new MutationObserver(actualizar).observe(tbody, { childList: true });
            actualizar();

            tbody.addEventListener('click', function (e) {
                const fila = e.target.closest('tr');
                if (!fila) return;
                const ya = fila.classList.contains('seleccionada');
                tbody.querySelectorAll('tr.seleccionada').forEach(r => r.classList.remove('seleccionada'));
                if (!ya) fila.classList.add('seleccionada');
            });
        })();
    </script>
</body>
</html>
